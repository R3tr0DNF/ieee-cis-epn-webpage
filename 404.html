<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IEEE Student Branch EPN</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages sirve este archivo para cualquier ruta que no existe como archivo
       (/capitulos, /directiva…). Guarda la ruta y vuelve a la portada, donde
       js/router.js la restaura sin el #. -->
  <script>
    try { sessionStorage.setItem('ieee-epn-ruta', location.pathname); } catch (e) {}
    location.replace('/');
  </script>
</head>
<body>
  <p>Redirigiendo… <a href="/">Ir al inicio</a></p>
</body>
</html>
